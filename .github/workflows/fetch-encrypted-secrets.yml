# Propre à ce dépôt : remplace celui de rdgen, qui télécharge un zip chiffré
# depuis le serveur rdgen. Ici, la configuration est versionnée dans
# .github/rdgen-env.json (généré par tools/sync-rdgen.py) et n'a rien de
# secret : elle est publiée sous le même nom d'artefact, que les générateurs
# téléchargent ensuite.
name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: false
        type: string

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Publish config
        run: cp .github/rdgen-env.json secrets.json

      - name: Upload config artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: encrypted-secrets-zip
          path: secrets.json
          retention-days: 1
